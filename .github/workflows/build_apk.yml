name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Scaffold Complete Android Project
        run: |
          cd flutter_app
          # Ensure fresh official Android scaffold with all Gradle wrappers
          rm -rf android
          flutter create . --platforms=android --org com.bepawsitive.ams --project-name attendance_manager
          
          # Configure minSdk = 21 and permissions safely using standalone script
          python3 ../tools/configure_android.py

          # Display modified AndroidManifest.xml for verification in logs
          cat android/app/src/main/AndroidManifest.xml

          # Grant execution rights to Gradle wrapper
          chmod +x android/gradlew || true
          
          flutter pub get

      - name: Build APK (Release)
        run: |
          cd flutter_app
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Manager-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (Latest APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Attendance Manager (Latest Update)"
          body: "Latest automated release. Tap the 'Check & Install Latest Update' button inside the app Settings to update directly inside the app!"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
