name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Complete Android Project
        run: |
          cd flutter_app
          # Ensure fresh official Android scaffold with all Gradle wrappers
          rm -rf android
          flutter create . --platforms=android --org com.bepawsitive.ams --project-name attendance_manager
          
          # Set minSdk = 21 (required by mobile_scanner / camera)
          for f in android/app/build.gradle*; do
            if [ -f "$f" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$f" || true
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$f" || true
              sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' "$f" || true
            fi
          done
          
          # Add Camera, Flash, Network and APK Install permissions to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />' "$MANIFEST"
          fi
          
          # Grant execution rights to Gradle wrapper
          chmod +x android/gradlew || true
          
          flutter pub get

      - name: Build APK (Release)
        run: |
          cd flutter_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-Manager-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (Latest APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Attendance Manager (Latest Update)"
          body: "Latest automated release. Tap the 'Check & Install Latest Update' button inside the app Settings to update directly inside the app!"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
